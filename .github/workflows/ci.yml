name: ci

# Triggers and concurrency follow RFC-1 R2.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  scripts:
    name: scripts (shellcheck, planted-violation tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/scripts/install-pyyaml.sh "$RUNNER_TEMP/venv"
      - run: make ci
        env:
          PYTHON: ${{ runner.temp }}/venv/bin/python

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./ci/actions/workflow-lint

  # The released actions, called the way a project calls them: by repository
  # path at a tag's SHA, so a remote caller's resolution of each action's
  # scripts is exercised, over the caller template.
  tagged-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/templates
      - uses: urzuahq/platform/ci/actions/workflow-lint@df7f9823006d6d9a6244c869bb03dc3c6c4136a4 # v0.2.0
        with:
          working-directory: ci/templates/default
      - uses: urzuahq/platform/ci/actions/ci-gate@df7f9823006d6d9a6244c869bb03dc3c6c4136a4 # v0.2.0
        with:
          needs: '{"checks":{"result":"success"},"workflow-lint":{"result":"success"}}'

  records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A merge-queue event carries no github.base_ref; without its own base
      # the gate skips the diff rules, drift included, for the queued commit.
      - name: resolve the base branch for the diff rules
        id: base
        env:
          PR_BASE: ${{ github.base_ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_ref }}
        run: echo "ref=${PR_BASE:-${QUEUE_BASE#refs/heads/}}" >> "$GITHUB_OUTPUT"
      - uses: urzuahq/urzua/.github/actions/urzua-gate@c72d0082896e602699f0b4e2ade3c78e1e039551 # v0.4.15
        with:
          version: v0.4.15
          base-ref: ${{ steps.base.outputs.ref }}

  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./ci/actions/install-knope
      - uses: ./ci/actions/install-nextest
      - uses: ./ci/actions/install-cargo-tools
      - run: |
          knope --version
          cargo-nextest nextest --version
          cargo-deny --version
          cargo-machete --version

  # The one required check (RFC-1 R1), run through the action callers use.
  ci:
    name: ci
    needs: [scripts, workflow-lint, tagged-actions, records, installers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci
      - uses: ./ci/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
