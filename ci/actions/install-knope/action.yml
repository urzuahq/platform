name: install knope
description: >-
  Installs the pinned knope release for the runner's OS and architecture,
  verified against its SHA-256, and puts it on PATH. The one place the knope
  version and checksums are written: every workflow that needs knope uses this
  action, and ci/scripts/tool-pins.test.sh fails when a workflow carries
  its own copy of the pin. A knope upgrade is a change to this file alone.

runs:
  using: composite
  steps:
    - name: install knope 0.23.0 (pinned, checksummed)
      shell: bash
      run: |
        set -euo pipefail
        version=0.23.0
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            target=x86_64-unknown-linux-musl
            sha256=76a970a5e237344abc14be3de37ed50c021b659a9b66b3f54afc77e6d48ac501 ;;
          macOS-ARM64)
            target=aarch64-apple-darwin
            sha256=a6e231cc7f02032c5b49ad14149c7d11fd48f0e244f9fb48d5c4c47ffb0e3863 ;;
          *) echo "install-knope: no pinned build for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        mkdir -p "$RUNNER_TEMP/knope" && cd "$RUNNER_TEMP/knope"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o knope.tgz "https://github.com/knope-dev/knope/releases/download/knope/v$version/knope-$target.tgz"
        echo "$sha256  knope.tgz" | shasum -a 256 -c -
        tar -xzf knope.tgz
        echo "$PWD/knope-$target" >> "$GITHUB_PATH"
        "$PWD/knope-$target/knope" --version
