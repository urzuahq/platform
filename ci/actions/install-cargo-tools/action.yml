name: install cargo tools
description: >-
  Installs the pinned cargo-deny and cargo-machete releases for the runner's OS
  and architecture, each verified against its SHA-256, and puts them on PATH.
  The one place their versions and checksums are written: every workflow that
  needs them uses this action, and ci/scripts/tool-pins.test.sh fails when a
  workflow carries its own copy of a pin. An upgrade is a change to this file
  alone.

runs:
  using: composite
  steps:
    - name: install cargo-deny 0.19.4 and cargo-machete 0.9.1 (pinned, checksummed)
      shell: bash
      run: |
        set -euo pipefail
        deny_version=0.19.4
        machete_version=0.9.1
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            target=x86_64-unknown-linux-musl
            deny_sha256=3bd58b784e83715b86ddbc9deac591890372ec77fda5741bb0826970b958506f
            machete_sha256=640b0814480b401e4e72201e52a13e1311b8eb8d7c27faa08bbe9886f252f26d ;;
          macOS-ARM64)
            target=aarch64-apple-darwin
            deny_sha256=2437a51d904b29abe2d3aa9ea87e353c86cff108d519ba1e5fb495bb28e7fbaf
            machete_sha256=72355383848acb154060e6fea2d5b7d58a825ed49fef157b46a6fe25180f8638 ;;
          *) echo "install-cargo-tools: no pinned build for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        mkdir -p "$RUNNER_TEMP/cargo-tools" && cd "$RUNNER_TEMP/cargo-tools"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/$deny_version/cargo-deny-$deny_version-$target.tar.gz"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o machete.tgz "https://github.com/bnjbvr/cargo-machete/releases/download/v$machete_version/cargo-machete-v$machete_version-$target.tar.gz"
        echo "$deny_sha256  deny.tgz" | shasum -a 256 -c -
        echo "$machete_sha256  machete.tgz" | shasum -a 256 -c -
        tar -xzf deny.tgz
        tar -xzf machete.tgz
        echo "$PWD/cargo-deny-$deny_version-$target" >> "$GITHUB_PATH"
        echo "$PWD/cargo-machete-v$machete_version-$target" >> "$GITHUB_PATH"
        "$PWD/cargo-deny-$deny_version-$target/cargo-deny" --version
        "$PWD/cargo-machete-v$machete_version-$target/cargo-machete" --version
