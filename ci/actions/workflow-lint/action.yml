name: workflow lint
description: >-
  Checks the calling repository's workflow files against the org CI standard
  (RFC-1 R1, R2, R4, R5). The caller checks out its repository first.

inputs:
  ci-workflow:
    description: The required-check workflow, held to the R1 and R2 rules.
    required: false
    default: .github/workflows/ci.yml
  default-branch:
    description: The branch `push` must be limited to.
    required: false
    default: main
  working-directory:
    description: The repository root to lint, relative to the workspace.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: install the pinned PyYAML
      shell: bash
      env:
        INSTALL: ${{ github.action_path }}/../../scripts/install-pyyaml.sh
        VENV: ${{ runner.temp }}/workflow-lint-venv
      run: '"$INSTALL" "$VENV"'
    - name: lint the workflow files
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LINT: ${{ github.action_path }}/../../scripts/workflow-lint.py
        VENV: ${{ runner.temp }}/workflow-lint-venv
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
      run: '"$VENV/bin/python" -I "$LINT" --ci-workflow "$CI_WORKFLOW" --default-branch "$DEFAULT_BRANCH"'
