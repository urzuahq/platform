name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Only a new commit cancels a run (urzuahq/platform RFC-1 R2).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make ci

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: urzuahq/platform/ci/actions/workflow-lint@df7f9823006d6d9a6244c869bb03dc3c6c4136a4 # v0.2.0

  # The one required check: fails on any failed, cancelled or skipped job.
  ci:
    name: ci
    needs: [checks, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: urzuahq/platform/ci/actions/ci-gate@df7f9823006d6d9a6244c869bb03dc3c6c4136a4 # v0.2.0
        with:
          needs: ${{ toJSON(needs) }}
